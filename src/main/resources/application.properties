# ==========================================
# Base de datos (Supabase / PostgreSQL)
# La contraseña NO va aquí: se lee de la variable de entorno DB_PASSWORD
# ==========================================
spring.datasource.url=jdbc:postgresql://aws-1-us-east-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0
spring.datasource.username=postgres.rdhntqsabwcbulnapfcg
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
logging.file.name=autored_audit.log

# ==========================================
# API de IA (Groq por defecto)
# La llave se lee de la variable de entorno GROK_API_KEY
# ==========================================
grok.api.key=${GROK_API_KEY}
# Para usar xAI en lugar de Groq, descomenta estas dos líneas:
# grok.api.url=https://api.x.ai/v1/chat/completions
# grok.api.model=grok-4

# ==========================================
# Supabase (API)
# La llave se lee de la variable de entorno SUPABASE_KEY
# ==========================================
supabase.url=https://rdhntqsabwcbulnapfcg.supabase.co
supabase.key=${SUPABASE_KEY}

server.port=${PORT:8080}